<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">
    <title>Commit generator</title>
</head>
<body>
    <div class="layout">
        <div class="hero-block">
            <h2 class="title">Commit generator</h2>
            <p class="description">
                Commit generator is a tool that generates a
                <a href="https://www.conventionalcommits.org/en/v1.0.0/">conventional commit</a>
                message based on a provided git diff result.
            </p>
        </div>
        <div class="form">
            <textarea id="diff" class="text-input" rows="10" cols="50" placeholder="Paste your git diff here"></textarea>
            <input id="btn" class="submit-input" type="submit" value="Generate">
        </div>
    </div>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
